apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: 5s

  - name: TimescaleDB
    uid: timescaledb
    type: grafana-postgresql-datasource
    url: timescaledb:5432
    user: marketpipe
    secureJsonData:
      password: marketpipe
    jsonData:
      database: marketpipe
      sslmode: disable
      postgresVersion: 1700
      timescaledb: true
