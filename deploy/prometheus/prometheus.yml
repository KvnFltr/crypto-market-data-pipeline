global:
  scrape_interval: 5s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  # The pipeline runs either in the compose stack ("pipeline" service) or on the host.
  - job_name: marketpipe
    static_configs:
      - targets: ["pipeline:8000"]
        labels: { deployment: container }
      - targets: ["host.docker.internal:8000"]
        labels: { deployment: host }

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
